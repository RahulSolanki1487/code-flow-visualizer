server {
  listen 80;

  # prefix is removed by the trailing slash on proxy_pass
  location /orders-svc/ {
    proxy_pass http://orders-api:3000/;
  }

  location /billing-svc/ {
    proxy_pass http://billing-api:8080/;
  }

  location / {
    root /usr/share/nginx/html;   # the Angular build
    try_files $uri /index.html;
  }
}
