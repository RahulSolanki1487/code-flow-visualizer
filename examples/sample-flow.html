<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sample-express-app – code flow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { min-height: 100vh; }
  .cfv-sidebar { width: 280px; min-width: 280px; border-right: 1px solid var(--bs-border-color); overflow-y: auto; }
  .cfv-sidebar .list-group-item { cursor: pointer; border: 0; border-radius: .375rem; }
  .cfv-main { flex: 1; min-width: 0; overflow-y: auto; }
  .cfv-diagram { height: 70vh; border: 1px solid var(--bs-border-color); border-radius: .5rem; overflow: hidden; position: relative; background: var(--bs-body-bg); }
  .cfv-diagram svg { width: 100%; height: 100%; max-width: none !important; }
  .cfv-zoom { position: absolute; right: .75rem; top: .75rem; z-index: 5; }
  .cfv-legend span { display: inline-flex; align-items: center; gap: .35rem; margin-right: 1rem; font-size: .85rem; }
  .cfv-dot { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
  .cfv-step.cfv-active { outline: 3px solid var(--bs-primary); outline-offset: 2px; }
  pre.cfv-snippet { background: var(--bs-tertiary-bg); padding: .75rem; border-radius: .375rem; font-size: .8rem; margin: .5rem 0 0; white-space: pre-wrap; }
  .cfv-file { font-family: var(--bs-font-monospace); font-size: .8rem; }
  .cfv-ref { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  .node { cursor: pointer; }
  @media (max-width: 991px) { .cfv-sidebar { display: none; } }
</style>
</head>
<body class="d-flex flex-column">

<nav class="navbar border-bottom px-3">
  <span class="navbar-brand mb-0 h1"><span class="text-primary">&#9670;</span> <span id="cfv-project"></span> <small class="text-body-secondary fs-6">code flow</small></span>
  <div class="d-flex gap-2 align-items-center">
    <input id="cfv-search" class="form-control form-control-sm" type="search" placeholder="Search steps, files…" style="width:240px">
    <button id="cfv-theme" class="btn btn-sm btn-outline-secondary text-nowrap" title="Toggle dark mode">Light / Dark</button>
  </div>
</nav>

<div class="d-flex flex-grow-1" style="min-height:0">
  <aside class="cfv-sidebar p-3">
    <div class="text-uppercase small fw-semibold text-body-secondary mb-2">Flows</div>
    <div id="cfv-flow-list" class="list-group"></div>
    <div class="mt-4 small text-body-secondary" id="cfv-generated"></div>
  </aside>

  <main class="cfv-main p-4">
    <div class="d-flex flex-wrap align-items-baseline gap-2 mb-1">
      <h2 class="h4 mb-0" id="cfv-title"></h2>
      <span class="badge text-bg-secondary" id="cfv-mode"></span>
      <span class="badge text-bg-light border" id="cfv-count"></span>
    </div>
    <div class="alert alert-primary border-0 my-3 d-none" id="cfv-plain" role="note">
      <div class="text-uppercase small fw-semibold mb-1">How it works</div>
      <div class="fs-6" id="cfv-plain-text"></div>
    </div>
    <p class="text-body-secondary small" id="cfv-summary"></p>

    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-diagram" type="button">Diagram</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-steps" type="button" id="cfv-steps-tab">Steps</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-files" type="button">Files</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-notes" type="button">Notes <span class="badge rounded-pill text-bg-warning" id="cfv-notes-count"></span></button></li>
    </ul>

    <div class="tab-content pt-3">
      <div class="tab-pane fade show active" id="tab-diagram">
        <div class="cfv-legend mb-2" id="cfv-legend"></div>
        <div class="cfv-diagram">
          <div class="cfv-zoom btn-group btn-group-sm">
            <button class="btn btn-outline-secondary bg-body" id="cfv-zin">+</button>
            <button class="btn btn-outline-secondary bg-body" id="cfv-zout">&minus;</button>
            <button class="btn btn-outline-secondary bg-body" id="cfv-zfit">Fit</button>
            <button class="btn btn-outline-secondary bg-body" id="cfv-layout" title="Change the diagram direction"></button>
          </div>
          <div id="cfv-diagram" class="h-100"></div>
        </div>
        <div class="small text-body-secondary mt-2">Tip: click a node to jump to its step. Dashed lines are inferred (not directly visible in code).</div>
      </div>
      <div class="tab-pane fade" id="tab-steps"><div class="accordion" id="cfv-steps"></div></div>
      <div class="tab-pane fade" id="tab-files">
        <table class="table table-sm align-middle">
          <thead><tr><th>File</th><th>Steps</th><th>Lines</th></tr></thead>
          <tbody id="cfv-files"></tbody>
        </table>
      </div>
      <div class="tab-pane fade" id="tab-notes"><ul class="list-group" id="cfv-notes"></ul></div>
    </div>
  </main>
</div>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('cfv-data').textContent);
  const TYPE_COLORS = {
    entry: '#0d6efd', logic: '#6c757d', data: '#198754', external: '#6f42c1',
    decision: '#fd7e14', error: '#dc3545', ui: '#0dcaf0', event: '#d63384'
  };
  const TYPE_NAMES = {
    entry: 'Entry point', logic: 'Logic', data: 'Data store', external: 'External service',
    decision: 'Decision', error: 'Error path', ui: 'Screen / UI', event: 'Event / queue'
  };
  let current = null, panZoom = null, renderSeq = 0;
  let layout = null; // 'vertical' | 'horizontal' chosen by the reader; null = as the flow was written
  const DIRECTION = { vertical: { flowchart: 'TD', state: 'TB' }, horizontal: { flowchart: 'LR', state: 'LR' } };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function theme() { return document.documentElement.getAttribute('data-bs-theme'); }

  function initMermaid() {
    if (!window.mermaid) return;
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose',
      theme: theme() === 'dark' ? 'dark' : 'default',
      flowchart: { htmlLabels: true, curve: 'basis' } });
  }

  const canRotate = (flow) => flow.diagram === 'flowchart' || flow.diagram === 'state';
  function flowLayout(flow) { return layout || (/^(LR|RL)$/.test(flow.direction) ? 'horizontal' : 'vertical'); }

  // The same diagram with its direction swapped; sequence diagrams only run top to bottom, so they are left alone.
  function diagramSource(flow) {
    if (!canRotate(flow)) return flow.mermaid;
    const dir = DIRECTION[flowLayout(flow)][flow.diagram];
    return flow.diagram === 'flowchart'
      ? flow.mermaid.replace(/^flowchart\s+\w+/, 'flowchart ' + dir)
      : flow.mermaid.replace(/^(\s*direction\s+)\w+/m, '$1' + dir);
  }

  function updateLayoutButton(flow) {
    const btn = $('cfv-layout');
    btn.classList.toggle('d-none', !canRotate(flow));
    const horizontal = flowLayout(flow) === 'horizontal';
    btn.textContent = horizontal ? 'Vertical' : 'Horizontal';
    btn.title = horizontal ? 'Show the diagram top to bottom' : 'Show the diagram left to right';
  }

  async function renderDiagram(flow) {
    const box = $('cfv-diagram');
    if (!window.mermaid) {
      box.innerHTML = '<div class="p-3 text-danger">Mermaid failed to load (offline?). Mermaid source:</div><pre class="cfv-snippet m-3">' + esc(flow.mermaid) + '</pre>';
      return;
    }
    const seq = ++renderSeq;
    const id = 'cfv-svg-' + seq;
    try {
      const { svg, bindFunctions } = await mermaid.render(id, diagramSource(flow));
      if (seq !== renderSeq) return; // a newer flow was selected while this one rendered; drop the stale result
      box.innerHTML = svg;
      if (bindFunctions) bindFunctions(box);
      const el = box.querySelector('svg');
      el.removeAttribute('style'); el.setAttribute('width', '100%'); el.setAttribute('height', '100%');
      if (panZoom) { try { panZoom.destroy(); } catch (e) {} }
      panZoom = window.svgPanZoom ? svgPanZoom(el, { controlIconsEnabled: false, fit: true, center: true, minZoom: 0.2, maxZoom: 10, dblClickZoomEnabled: false }) : null;
    } catch (err) {
      if (seq !== renderSeq) return;
      box.innerHTML = '<div class="p-3 text-danger">Diagram error: ' + esc(err.message || err) + '</div><pre class="cfv-snippet m-3">' + esc(flow.mermaid) + '</pre>';
    }
  }

  function renderSteps(flow) {
    const acc = $('cfv-steps');
    acc.innerHTML = flow.steps.map((n, i) => {
      const color = TYPE_COLORS[n.type] || '#6c757d';
      const loc = n.file ? `<span class="cfv-file">${esc(n.file)}${n.line ? ':' + n.line : ''}</span>` : '<span class="text-body-secondary small">external</span>';
      const vs = n.vscode ? `<a class="btn btn-sm btn-outline-secondary mt-2 me-2" href="${esc(n.vscode)}">Open in VS Code</a>` : '';
      const inferred = n.inferred ? '<span class="badge text-bg-warning ms-2">inferred</span>' : '';
      const callers = (n.callers || []).map(c => `<button class="btn btn-sm btn-outline-secondary mt-2 me-2" data-goto="${esc(c.flow)}">&larr; Called from: ${esc(c.label)}</button>`).join('');
      const link = vs + callers + (n.link_to ? `<button class="btn btn-sm btn-outline-primary mt-2" data-goto="${esc(n.link_to)}">Open sub-flow &rarr;</button>` : '');
      return `
      <div class="accordion-item cfv-step" id="step-${esc(n.id)}" data-search="${esc((n.label + ' ' + (n.file||'') + ' ' + (n.description||'')).toLowerCase())}">
        <h3 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#body-${esc(n.id)}">
            <span class="cfv-dot me-2" style="background:${color}"></span>
            <span class="me-2 text-body-secondary">${i + 1}.</span>
            <span class="fw-semibold me-3">${esc(n.label)}</span>${loc}${inferred}
          </button>
        </h3>
        <div id="body-${esc(n.id)}" class="accordion-collapse collapse">
          <div class="accordion-body">
            <div class="small text-body-secondary mb-1">${esc(TYPE_NAMES[n.type] || n.type)}</div>
            <div>${esc(n.description)}</div>
            ${n.note ? `<div class="alert alert-warning py-1 px-2 mt-2 mb-0 small">${esc(n.note)}</div>` : ''}
            ${n.snippet ? `<pre class="cfv-snippet"><code>${esc(n.snippet)}</code></pre>` : ''}
            ${n.outgoing && n.outgoing.length ? `<div class="small mt-2">Next: ${n.outgoing.map(o => `<a href="#" data-step="${esc(o.to)}">${esc(o.label_to)}</a>${o.label ? ' <span class="text-body-secondary">(' + esc(o.label) + ')</span>' : ''}`).join(', ')}</div>` : ''}
            ${link}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function renderFiles(flow) {
    const map = {};
    flow.steps.forEach((n, i) => { if (!n.file) return; (map[n.file] ||= []).push({ i: i + 1, id: n.id, line: n.line }); });
    $('cfv-files').innerHTML = Object.keys(map).sort().map(f =>
      `<tr><td class="cfv-file">${esc(f)}</td><td>${map[f].map(s => `<a href="#" data-step="${esc(s.id)}">#${s.i}</a>`).join(' ')}</td><td class="small">${map[f].map(s => s.line).filter(Boolean).join(', ')}</td></tr>`
    ).join('') || '<tr><td colspan="3" class="text-body-secondary">No files.</td></tr>';
  }

  function renderNotes(flow) {
    const notes = [...(flow.notes || []), ...flow.steps.filter(n => n.inferred && n.note).map(n => `${n.label}: ${n.note}`)];
    $('cfv-notes-count').textContent = notes.length || '';
    $('cfv-notes').innerHTML = notes.map(t => `<li class="list-group-item">${esc(t)}</li>`).join('') || '<li class="list-group-item text-body-secondary">No notes.</li>';
  }

  function renderLegend(flow) {
    const used = [...new Set(flow.steps.map(n => n.type))];
    $('cfv-legend').innerHTML = used.map(t => `<span><i class="cfv-dot" style="background:${TYPE_COLORS[t] || '#999'}"></i>${esc(TYPE_NAMES[t] || t)}</span>`).join('')
      + '<span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="currentColor" stroke-dasharray="4 3"/></svg>Inferred</span>';
  }

  // The "How it works" text names diagram steps exactly as the diagram shows them; each name becomes a link to its step.
  function renderPlain(flow) {
    const box = $('cfv-plain'), out = $('cfv-plain-text');
    if (!flow.plain_summary) { out.textContent = ''; box.classList.add('d-none'); return; }
    const marks = [];
    let html = esc(flow.plain_summary);
    flow.steps.filter(s => s.label).sort((a, b) => b.label.length - a.label.length).forEach(s => {   // longest name first
      const re = new RegExp('(?<!\\w)' + esc(s.label).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?!\\w)', 'gi');
      html = html.replace(re, m => { marks.push({ m, id: s.id }); return '' + (marks.length - 1) + ''; });
    });
    html = html.replace(/(\d+)/g, (_, i) =>
      `<a href="#" class="cfv-ref fw-semibold" data-step="${esc(marks[i].id)}" title="Show this step">${marks[i].m}</a>`);
    out.innerHTML = html;
    box.classList.remove('d-none');
  }

  function selectFlow(id) {
    const flow = DATA.flows.find(f => f.id === id) || DATA.flows[0];
    current = flow;
    document.querySelectorAll('#cfv-flow-list .list-group-item').forEach(el => el.classList.toggle('active', el.dataset.flow === flow.id));
    $('cfv-title').textContent = flow.title;
    $('cfv-mode').textContent = flow.mode === 'user' ? 'User flow' : 'Code flow';
    $('cfv-count').textContent = flow.steps.length + ' steps';
    $('cfv-summary').textContent = flow.summary || '';
    renderPlain(flow);
    updateLayoutButton(flow);
    renderLegend(flow); renderSteps(flow); renderFiles(flow); renderNotes(flow); renderDiagram(flow);
    $('cfv-search').value = '';
    history.replaceState(null, '', '#' + flow.id);
  }

  // Switch to another flow from anywhere: go back to the Diagram tab first (so the diagram is
  // rendered into a visible pane), then load that flow's data into every tab.
  function openFlow(id) {
    bootstrap.Tab.getOrCreateInstance(document.querySelector('[data-bs-target="#tab-diagram"]')).show();
    selectFlow(id);
    const main = document.querySelector('main'); if (main) main.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  window.cfvSelect = function (nodeId) {
    bootstrap.Tab.getOrCreateInstance($('cfv-steps-tab')).show();
    document.querySelectorAll('.cfv-step').forEach(el => el.classList.remove('cfv-active'));
    const card = $('step-' + nodeId); if (!card) return;
    card.classList.add('cfv-active');
    bootstrap.Collapse.getOrCreateInstance($('body-' + nodeId), { toggle: false }).show();
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
  };

  document.addEventListener('click', (e) => {
    const s = e.target.closest('[data-step]'); if (s) { e.preventDefault(); cfvSelect(s.dataset.step); return; }
    const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); openFlow(g.dataset.goto); }
  });

  $('cfv-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (q) bootstrap.Tab.getOrCreateInstance($('cfv-steps-tab')).show();
    document.querySelectorAll('.cfv-step').forEach(el => el.classList.toggle('d-none', q && !el.dataset.search.includes(q)));
  });

  $('cfv-theme').addEventListener('click', () => {
    document.documentElement.setAttribute('data-bs-theme', theme() === 'dark' ? 'light' : 'dark');
    try { localStorage.setItem('cfv-theme', theme()); } catch (e) {}
    initMermaid(); if (current) renderDiagram(current);
  });
  $('cfv-zin').onclick = () => panZoom && panZoom.zoomIn();
  $('cfv-zout').onclick = () => panZoom && panZoom.zoomOut();
  $('cfv-zfit').onclick = () => { if (panZoom) { panZoom.resize(); panZoom.fit(); panZoom.center(); } };
  $('cfv-layout').onclick = () => {
    if (!current) return;
    layout = flowLayout(current) === 'horizontal' ? 'vertical' : 'horizontal';
    try { localStorage.setItem('cfv-layout', layout); } catch (e) {}
    updateLayoutButton(current);
    renderDiagram(current);
  };
  document.querySelector('[data-bs-target="#tab-diagram"]').addEventListener('shown.bs.tab', () => { if (panZoom) { panZoom.resize(); panZoom.fit(); panZoom.center(); } });

  try { const t = localStorage.getItem('cfv-theme'); if (t) document.documentElement.setAttribute('data-bs-theme', t); } catch (e) {}
  try { const l = localStorage.getItem('cfv-layout'); if (l === 'vertical' || l === 'horizontal') layout = l; } catch (e) {}
  $('cfv-project').textContent = DATA.project || 'Project';
  $('cfv-generated').textContent = DATA.generated_at ? 'Generated ' + DATA.generated_at : '';
  $('cfv-flow-list').innerHTML = DATA.flows.map(f =>
    `<a class="list-group-item list-group-item-action" data-flow="${esc(f.id)}" onclick="return false">${esc(f.title)}<div class="small opacity-75">${f.steps.length} steps · ${f.mode === 'user' ? 'user' : 'code'}</div></a>`).join('');
  document.querySelectorAll('#cfv-flow-list .list-group-item').forEach(el => el.addEventListener('click', () => openFlow(el.dataset.flow)));
  initMermaid();
  selectFlow(location.hash.slice(1));
})();
</script>
</body>
</html>
